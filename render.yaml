services:
  # Backend Spring Boot Service
  - type: web
    name: sonexa-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_HOST
        sync: false # TiDB Cloud host (e.g. gateway01.ap-southeast-1.prod.aws.tidbcloud.com)
      - key: DB_PORT
        value: "4000" # TiDB Cloud default port is 4000
      - key: DB_NAME
        value: "music_player"
      - key: DB_USER
        sync: false # TiDB Cloud user (e.g. 2DsEao8jVo9mdfz.root)
      - key: DB_PASS
        sync: false # TiDB Cloud password
      - key: DB_USE_SSL
        value: "true"
      - key: REDIS_HOST
        sync: false # Upstash Redis host (e.g. smashing-starfish-240224.upstash.io)
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASS
        sync: false # Upstash Redis password
      - key: REDIS_SSL_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIUS_APP_NAME
        value: "Sonexa"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://sonexa-frontend.onrender.com,https://sonexamusic.vercel.app

  # Frontend React SPA Service
  - type: web
    name: sonexa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your Render backend API URL (e.g. https://sonexa-backend.onrender.com/api)
