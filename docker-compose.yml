version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sonexa-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: music_player
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sonexa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: sonexa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sonexa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonexa-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=music_player
      - DB_USER=root
      - DB_PASS=rootpassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sonexa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: sonexa-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sonexa-network

volumes:
  mysql_data:
  redis_data:

networks:
  sonexa-network:
    driver: bridge
